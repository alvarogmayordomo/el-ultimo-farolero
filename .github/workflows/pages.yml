# Publica el juego en GitHub Pages cada vez que algo llega a main.
#
# 1. «construir»: instala las dependencias exactas (npm ci), pasa Biome, los tests
#    y la build de producción, y sube la carpeta dist/ como artefacto de Pages.
# 2. «publicar»: despliega ese artefacto en
#    https://alvarogmayordomo.github.io/el-ultimo-farolero/
#
# Si un test o el linter fallan, no se publica nada.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; uno nuevo no cancela el que está en marcha
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
